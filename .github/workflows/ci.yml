name: Verify
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: ruff format --check backend
      - run: pytest -q
      - run: python -m backend.app.audit
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run format:check
      - run: npm audit --audit-level=moderate
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wind-intelligence .
      - run: |
          docker run -d --name wind -p 8000:8000 wind-intelligence
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/readyz; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/readyz
          curl -fsS http://localhost:8000/ | grep 'Wind Intelligence'
          curl -fsS 'http://localhost:8000/api/v1/day?decision_date=2026-01-31' | python -c "import sys,json; assert json.load(sys.stdin)['delivery_date']=='2026-02-01'"
